name: ML Auto Deployment CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: ml-auto-deployment

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and Train Model
      run: |
        python -m pip install --upgrade pip
        pip install -r model/requirements.txt
        python model/train.py

  deploy-to-huggingface:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and Train Model
      run: |
        python -m pip install --upgrade pip
        pip install -r model/requirements.txt
        python model/train.py

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Replace with your Hugging Face username and space name
        HF_SPACE_NAME: dwssp/ml-auto-deployment 
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git add app/model_data/model.joblib
        git commit -m "Update model and code" || echo "No changes to commit"
        git push --force https://SadeepSachintha:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME main

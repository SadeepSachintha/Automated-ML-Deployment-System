name: ML Auto Deployment CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: ml-auto-deployment

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and Train Model
      run: |
        python -m pip install --upgrade pip
        pip install -r model/requirements.txt
        python model/train.py

  deploy-to-huggingface:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and Train Model
      run: |
        python -m pip install --upgrade pip
        pip install -r model/requirements.txt
        python model/train.py

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install huggingface_hub
        python -c "
        from huggingface_hub import HfApi
        api = HfApi()
        api.upload_folder(
            folder_path='.',
            repo_id='dwssp/ml-auto-deployment',
            repo_type='space',
            token='${{ secrets.HF_TOKEN }}',
            path_in_repo='.',
            ignore_patterns=['.git*', 'venv*', '__pycache__*']
        )
        "
